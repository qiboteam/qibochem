[project]
name = "qibochem"
version = "0.0.6"
description = "Quantum chemistry module for quantum computing with Qibo"
authors = [{ name = "The Qibo team" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<3.14"
keywords = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "qibo>=0.3.5",
  "numpy>=2.0.0",
  "scipy>=1.15.2",
  "sympy>=1.13.1",
  "openfermion>=1.8.1",
  "pyscf>=2.14.0",
]

[project.urls]
Repository = "https://github.com/qiboteam/qibochem/"
Documentation = "https://qibo.science/qibochem/stable/"

[dependency-groups]
analysis = ["ruff>=0.16.8"]
docs = [
  "sphinx>=7.0.0",
  "furo>=2023.3.27",
  "recommonmark>=0.7.1",
  "sphinxcontrib-bibtex>=2.5.0",
  "sphinxcontrib-katex>=0.9.6",
  "sphinx-markdown-tables>=0.0.17",
  "nbsphinx>=0.9.1",
  "ipython>=8.34.0",
  "sphinx-copybutton>=0.5.2",
]
tests = [
  "pytest>=7.2.1",
  "pytest-cov>=4.0.0",
]

[build-system]
requires = ["uv_build>=0.12.9"]
build-backend = "uv_build"

[tool.poe.tasks]
test = "pytest"
lint = "ruff check"
lint-warnings = "ruff check --exit-zero"
docs = "make -C doc html"
docs-clean = "make -C doc clean"
test-docs = "make -C doc doctest"

[tool.ruff]
target-version = "py311"
line-length = 88
# Exclude symlinked notebook
extend-exclude = ["doc/source/tutorials/excited_states.ipynb"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "C90", "N", "UP", "B", "A", "C4", "T10",
    "EM", "EXE", "ISC", "ICN", "LOG", "G", "INP", "PIE", "T20",
    "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TC", "INT",
    "ARG", "PTH", "ERA", "NPY", "PERF", "RUF",
]
extend-select = ["I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Psi4 driver should work but is not actively supported
"src/qibochem/driver/molecule.py" = ["ERA001"]
"tests/*.py" = ["INP001", "PT011", "SLF001", "ERA001"]
"examples/*.py" = ["ERA001", "T201", "E501", "INP001"]
"tutorials/*.ipynb" = ["E501", "T201", "I001"]
"doc/source/conf.py" = ["INP001", "E501", "A001"]

[tool.pytest.ini_options]
testpaths = ['tests/']
filterwarnings = ['ignore::RuntimeWarning']
addopts = ['--cov=qibochem', '--cov-report=xml', '--cov-report=html']
