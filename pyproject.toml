[tool.poetry]
name = "qibochem"
version = "0.0.6"
description = "Quantum chemistry module for quantum computing with Qibo"
authors = ["The Qibo team"]
license = "Apache License 2.0"
readme = "README.md"
repository = "https://github.com/qiboteam/qibochem/"
documentation = "https://qibo.science/qibochem/stable"
keywords = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]
packages = [{ include = "qibochem", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
qibo = "^0.3.4"
openfermion = "^1.8.1"
pyscf = "^2.14.0"
scipy = "^1.15.2"
numpy = "^2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.analysis]
optional = true

[tool.poetry.group.analysis.dependencies]
ruff = "^0.16.8"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "F", "E", "W", "C90", "N", "UP", "B", "A", "C4", "T10",
    "EM", "EXE", "ISC", "ICN", "LOG", "G", "INP", "PIE", "T20",
    "PT", "Q", "RSE", "RET", "SLF", "SLOT", "SIM", "TC", "INT",
    "ARG", "PTH", "ERA", "NPY", "PERF", "RUF",
]
extend-select = ["I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Psi4 driver should work but is not actively supported
"src/qibochem/driver/molecule.py" = ["ERA001"]
"tests/*.py" = ["INP001", "PT011", "SLF001", "ERA001"]

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^7.0.0"
furo = "^2023.3.27"
recommonmark = "^0.7.1"
sphinxcontrib-bibtex = "^2.5.0"
sphinxcontrib-katex = "^0.9.6"
sphinx-markdown-tables = "^0.0.17"
nbsphinx = "^0.9.1"
ipython = "^8.34.0"
sphinx-copybutton = "^0.5.2"

[tool.poetry.group.tests]
optional = true

[tool.poetry.group.tests.dependencies]
pytest = ">=7.2.1"
pytest-cov = ">=4.0.0"
pytest-env = ">=0.8.1"

[tool.poe.tasks]
test = "pytest"
lint = "ruff check"
lint-warnings = "ruff check --exit-zero"
docs = "make -C doc html"
docs-clean = "make -C doc clean"
test-docs = "make -C doc doctest"

[tool.pytest.ini_options]
testpaths = ['tests/']
addopts = ['--cov=qibochem', '--cov-report=xml', '--cov-report=html']
